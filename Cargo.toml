[package]
name = "roc"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "roc (run opencode container): launch AI coding agents (opencode, goose, claude code, codex) against LM Studio, Ollama or any OpenAI-compatible model inside a disposable Docker container with 1:1 host path mounts and a policy-enforced MCP gateway."
license = "Apache-2.0"
repository = "https://github.com/andreimerlescu/roc"
homepage = "https://github.com/andreimerlescu/roc"
readme = "README.md"
keywords = ["opencode", "docker", "mcp", "lmstudio", "ollama"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Play and Prosper <https://github.com/playandprosper>", "Andrei Merlescu <https://github.com/andreimerlescu>"]
include = ["src/**", "docker/**", "schema/**", "Cargo.toml", "Cargo.lock", "README.md", "INSTALL.md", "LICENSE", "NOTICE"]

[[bin]]
name = "roc"
path = "src/main.rs"

[lib]
name = "roc"
path = "src/lib.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dunce = "1.0.5"
fs2 = "0.4.3"
gethostname = "1.1.0"
getrandom = "0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.4.5"
tiny_http = "0.12.0"
toml = "1.1.6"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[profile.release]
lto = true
codegen-units = 1
strip = true
